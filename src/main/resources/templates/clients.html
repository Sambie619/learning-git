<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clients</title>
</head>
<body>

<div th:insert="navbar"></div>

<h2>Clients</h2>

<p>
    <a href="/clients/add">Add Client</a>
</p>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Company</th>
        <th>Address</th>
        <th>Contact No</th>
        <th>Email</th>
    </tr>

    <tr th:each="c : ${clients}">
        <td th:text="${c.clientId}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.company}"></td>
        <td th:text="${c.address}"></td>
        <td th:text="${c.contactNo}"></td>
        <td th:text="${c.email}"></td>
    </tr>
</table>

</body>
</html>
